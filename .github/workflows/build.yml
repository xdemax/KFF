name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: "6.7.3"

jobs:
  macos:
    name: macOS (universal .dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # нужны теги для git describe

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Bundle Qt and create .dmg
        run: macdeployqt build/KarabasFlasher.app -dmg

      - uses: actions/upload-artifact@v4
        with:
          name: KarabasFlasher-macos
          path: build/KarabasFlasher.dmg

  windows:
    name: Windows (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          modules: qtserialport
          cache: true

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Bundle Qt and zip
        shell: pwsh
        run: |
          windeployqt build/Release/KarabasFlasher.exe
          Compress-Archive -Path build/Release/* -DestinationPath KarabasFlasher-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KarabasFlasher-windows
          path: KarabasFlasher-windows.zip

  linux:
    name: Linux (compile check + binary)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qt6-base-dev qt6-serialport-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p dist/KarabasFlasher
          cp build/KarabasFlasher dist/KarabasFlasher/
          cp packaging/70-karabas.rules docs/DEPENDENCIES_linux.txt README.md dist/KarabasFlasher/
          tar -C dist -czf KarabasFlasher-linux-x86_64.tar.gz KarabasFlasher

      - uses: actions/upload-artifact@v4
        with:
          name: KarabasFlasher-linux
          path: KarabasFlasher-linux-x86_64.tar.gz

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the CMake version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(grep -oP '^project\(.*VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)
          echo "tag=$TAG cmake=v$VER"
          if [ "v$VER" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the version v$VER in CMakeLists.txt"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir release
          cp artifacts/KarabasFlasher-macos/KarabasFlasher.dmg "release/KarabasFlasher-${TAG}-macos.dmg"
          cp artifacts/KarabasFlasher-windows/KarabasFlasher-windows.zip "release/KarabasFlasher-${TAG}-windows.zip"
          cp artifacts/KarabasFlasher-linux/KarabasFlasher-linux-x86_64.tar.gz "release/KarabasFlasher-${TAG}-linux-x86_64.tar.gz"
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
